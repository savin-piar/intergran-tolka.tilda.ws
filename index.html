<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страницы проекта</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #f3f3f3;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      padding: 48px 20px;
    }

    .project-pages {
      width: min(720px, 100%);
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .page-link {
      display: flex;
      align-items: center;
      min-height: 46px;
      width: 100%;
      padding: 0 18px;
      border-radius: 8px;
      background: #f3f3f3;
      color: #111111;
      text-decoration: none;
      font-size: 16px;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .page-link:hover {
      background: #e9e9e9;
      transform: translateX(2px);
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 14px;
      }

      .project-pages {
        padding: 22px;
        border-radius: 12px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <main class="project-pages">
    <h1>Страницы проекта</h1>

    <a class="page-link" href="page1.html">
      Шаблон коммерческой страницы
    </a>
  </main>
</body>
</html>
