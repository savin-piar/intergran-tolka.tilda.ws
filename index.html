<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шаблоны</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 0 32px;
      background: #d1b06d;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      border: 1px solid #d1b06d;
      transition: 0.2s ease;
    }

    a:hover {
      background: #ffffff;
      color: #b8934f;
    }
  </style>
</head>
<body>
  <a href="page1.html">Шаблон коммерческой страницы</a>
